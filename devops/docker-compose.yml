version: "3.3"

services:
  mongo:
    image: mongo:7.0
    container_name: apontamento-mongo
    restart: unless-stopped
    env_file:
      - ./mongo.env
    volumes:
      - mongo-data:/data/db
    networks:
      - apontamento-net

  backend:
    build:
      context: ../backend
      dockerfile: src/Apontamento.Api/Dockerfile
    image: apontamento-api:latest
    container_name: apontamento-backend
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - ./backend.env
    ports:
      - "8080:8080"
    networks:
      - apontamento-net

  frontend:
    build:
      context: ../frontend/src
      dockerfile: Dockerfile
    image: apontamento-frontend:latest
    container_name: apontamento-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ./frontend.env      
    ports:
      - "3000:3000"
    networks:
      - apontamento-net

volumes:
  mongo-data:

networks:
  apontamento-net:
    driver: bridge
